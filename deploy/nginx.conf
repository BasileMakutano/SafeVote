# /etc/nginx/sites-available/safevote  (replace example.com with your domain)
limit_req_zone $binary_remote_addr zone=signin:10m rate=10r/m;

# Plain HTTP: serve ACME challenges, redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name example.com vote.example.com admin.example.com results.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: one server block, the app routes by Host header (vote., admin., results.).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com vote.example.com admin.example.com results.example.com;

    ssl_certificate     /etc/ssl/safevote/fullchain.pem;
    ssl_certificate_key /etc/ssl/safevote/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 300k;
    server_tokens off;

    # Slow down password guessing at the edge (the app also locks accounts).
    location = /login {
        limit_req zone=signin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/safevote-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/safevote-proxy.conf;
    }
}
